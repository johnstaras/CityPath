<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#grad1)"/>

  <!-- Inner circle highlight -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>

  <!-- Location pin body -->
  <path d="M200 80 C150 80 110 120 110 170 C110 230 200 310 200 310 C200 310 290 230 290 170 C290 120 250 80 200 80 Z" fill="#ffffff"/>

  <!-- Inner circle of pin -->
  <circle cx="200" cy="165" r="40" fill="url(#grad2)"/>

  <!-- Walking person icon inside pin -->
  <!-- Head -->
  <circle cx="200" cy="145" r="8" fill="#ffffff"/>
  <!-- Body -->
  <line x1="200" y1="153" x2="200" y2="172" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="188" y1="160" x2="212" y2="160" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="200" y1="172" x2="190" y2="188" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="200" y1="172" x2="210" y2="188" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Path/route dots around the pin -->
  <circle cx="130" cy="250" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="145" cy="270" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="165" cy="285" r="3" fill="#ffffff" opacity="0.4"/>

  <circle cx="270" cy="250" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="255" cy="270" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="235" cy="285" r="3" fill="#ffffff" opacity="0.4"/>

  <!-- Accessibility symbol (small) bottom right -->
  <circle cx="260" cy="130" r="15" fill="#ffffff" opacity="0.3"/>
  <circle cx="260" cy="125" r="4" fill="#ffffff" opacity="0.5"/>
  <path d="M260 130 L260 140 L268 145" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <circle cx="260" cy="142" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
</svg>
